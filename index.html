<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATS Resume Analyzer</title>

  <link rel="stylesheet" href="resume.css">

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
  <h1>ATS Resume Analyzer</h1>
  <p>Upload Job Description & Resume to calculate ATS score</p>

  <!-- Job Description -->
  <h2>Job Description</h2>

  <input type="file" id="jdFile" accept="application/pdf">
  <button onclick="extractJD()">Upload JD PDF</button>

  <textarea id="jdText" placeholder="OR paste Job Description here..."></textarea>
  <button onclick="useJDText()">Use Pasted JD</button>

  <!-- Resume Upload -->
  <div class="upload-box hidden" id="resumeSection">
    <h2>Upload Resume</h2>
    <input type="file" id="resumeFile" accept="application/pdf">
    <button onclick="analyzeResume()">Analyze Resume</button>
  </div>

  <!-- Results -->
  <div id="result" class="result-box hidden">
    <h2>ATS Score: <span id="score"></span>/100</h2>

    <canvas id="skillChart"></canvas>

    <h3>Matched Skills</h3>
    <div id="matched"></div>

    <h3>Missing Skills</h3>
    <div id="missing"></div>
  </div>
</div>

<script src="resume.js"></script>
</body>
</html>
